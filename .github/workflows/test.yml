name: test
# Unit tests, then the browser check twice: once offline (the page's own copy of the
# shared design and its light/dark switch) and once with the shared theme, settings panel
# and sky as the live portfolio serves them.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: |
          mkdir -p "$RUNNER_TEMP/site/design" "$RUNNER_TEMP/site/fonts"
          for f in tokens.css ui.css theme.js ui.js fonts.css; do
            curl -fsSL "https://areeb-ece.github.io/design/$f" -o "$RUNNER_TEMP/site/design/$f"
          done
          for f in LibreFranklin-Var.woff2 LibreFranklin-Italic-Var.woff2; do
            curl -fsSL "https://areeb-ece.github.io/fonts/$f" -o "$RUNNER_TEMP/site/fonts/$f" || true
          done
      - run: npm run test:browser
        env:
          DESIGN_DIR: ${{ runner.temp }}/site/design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
